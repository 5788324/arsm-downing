[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-config --strict-markers -m "not manual and not windows_integration and not live_network"
markers =
    portable: deterministic test that uses only temporary files/databases
    manual: test requiring explicit human invocation or inspection
    windows_integration: test requiring a Windows desktop/Flet/filesystem environment
    live_network: test that contacts ASMR.one or another external service
