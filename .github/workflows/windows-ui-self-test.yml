name: windows-ui-self-test

on:
  push:
    branches:
      - chatgpt/ui-self-test-20260721
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-ui-acceptance:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install application and browser dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install chromium

      - name: Download previously verified Windows build artifact
        uses: actions/download-artifact@v6
        with:
          name: ARSM-Suite-Windows
          path: ${{ runner.temp }}/windows-artifact
          github-token: ${{ github.token }}
          run-id: 29834355321

      - name: Verify and launch portable Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:RUNNER_TEMP "ARSM-UI-Evidence"
          $appRoot = Join-Path $env:RUNNER_TEMP "ARSM EXE 中文 空格"
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          New-Item -ItemType Directory -Path $appRoot -Force | Out-Null
          $innerZip = Get-ChildItem "$env:RUNNER_TEMP/windows-artifact" -Filter "*.zip" -File | Select-Object -First 1
          $shaFile = Get-ChildItem "$env:RUNNER_TEMP/windows-artifact" -Filter "*.sha256" -File | Select-Object -First 1
          if (-not $innerZip -or -not $shaFile) { throw "Windows artifact is incomplete" }
          $expected = ((Get-Content $shaFile.FullName -Raw).Trim() -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $innerZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows ZIP SHA-256 mismatch" }
          Expand-Archive -LiteralPath $innerZip.FullName -DestinationPath $appRoot -Force
          $exe = Join-Path $appRoot "ARSM-Suite.exe"
          if (-not (Test-Path $exe)) { throw "ARSM-Suite.exe is missing" }
          $process = Start-Process -FilePath $exe -WorkingDirectory $appRoot -PassThru
          Start-Sleep -Seconds 18
          $process.Refresh()
          if ($process.HasExited) { throw "Portable EXE exited during startup with code $($process.ExitCode)" }
          $files = Get-ChildItem -LiteralPath $appRoot -Force | Select-Object Name,Length,LastWriteTime
          $files | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $evidence "portable-exe-files.json")
          @{
            pid = $process.Id
            alive_after_18_seconds = $true
            zip_sha256 = $actual
            exe_path = $exe
            config_exists = Test-Path (Join-Path $appRoot "config.json")
            database_exists = Test-Path (Join-Path $appRoot "history.db")
          } | ConvertTo-Json | Set-Content -Encoding utf8NoBOM (Join-Path $evidence "portable-exe-result.json")
          $closed = $process.CloseMainWindow()
          if ($closed) { $process.WaitForExit(15000) | Out-Null }
          if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }

      - name: Create isolated slow ASMR-compatible server
        shell: pwsh
        run: |
          @'
          import argparse
          import asyncio
          import base64
          from aiohttp import web

          RJ = "99999999"
          TOTAL = 16 * 1024 * 1024
          CHUNK = 64 * 1024
          COVER = base64.b64decode("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Y9ZrWQAAAAASUVORK5CYII=")

          async def work_info(request):
              base = f"{request.scheme}://{request.host}"
              return web.json_response({
                  "title": "ARSM Windows UI Acceptance",
                  "circle": {"name": "Automated Test Circle"},
                  "vas": [{"name": "Automated Voice"}],
                  "tags": [{"name": "windows-ui-test"}],
                  "price": 0,
                  "dl_count": 1,
                  "rate_average_2dp": 5.0,
                  "release_date": "2026-07-21",
                  "source_url": base,
                  "mainCoverUrl": f"{base}/cover.png",
              })

          async def tracks(request):
              base = f"{request.scheme}://{request.host}"
              return web.json_response([{
                  "id": 1,
                  "title": "01 Windows UI acceptance track.bin",
                  "type": "audio",
                  "size": TOTAL,
                  "mediaDownloadUrl": f"{base}/media/acceptance.bin",
              }])

          async def cover(request):
              return web.Response(body=COVER, content_type="image/png")

          async def media(request):
              value = request.headers.get("Range", "")
              start = 0
              status = 200
              headers = {"Accept-Ranges": "bytes"}
              if value:
                  if not value.startswith("bytes=") or not value.endswith("-"):
                      raise web.HTTPBadRequest()
                  start = int(value[6:-1])
                  if start >= TOTAL:
                      return web.Response(status=416, headers={"Content-Range": f"bytes */{TOTAL}"})
                  status = 206
                  headers["Content-Range"] = f"bytes {start}-{TOTAL - 1}/{TOTAL}"
              headers["Content-Length"] = str(TOTAL - start)
              response = web.StreamResponse(status=status, headers=headers)
              response.content_type = "application/octet-stream"
              await response.prepare(request)
              position = start
              pattern = b"ARSM-WINDOWS-UI-ACCEPTANCE\n"
              try:
                  while position < TOTAL:
                      size = min(CHUNK, TOTAL - position)
                      data = (pattern * ((size // len(pattern)) + 1))[:size]
                      await response.write(data)
                      position += size
                      await asyncio.sleep(0.05)
              except (ConnectionResetError, asyncio.CancelledError):
                  pass
              return response

          app = web.Application()
          app.router.add_get("/api/workInfo/{rj}", work_info)
          app.router.add_get("/api/tracks/{rj}", tracks)
          app.router.add_get("/cover.png", cover)
          app.router.add_get("/media/acceptance.bin", media)

          parser = argparse.ArgumentParser()
          parser.add_argument("--port", type=int, default=8765)
          args = parser.parse_args()
          web.run_app(app, host="127.0.0.1", port=args.port, print=None)
          '@ | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/slow_asmr_server.py"

      - name: Start isolated server and Flet Web UI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sandbox = Join-Path $env:RUNNER_TEMP "ARSM UI Smoke 中文 空格"
          $evidence = Join-Path $env:RUNNER_TEMP "ARSM-UI-Evidence"
          if (Test-Path $sandbox) { Remove-Item $sandbox -Recurse -Force }
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $server = Start-Process python -ArgumentList @("$env:RUNNER_TEMP/slow_asmr_server.py", "--port", "8765") -RedirectStandardOutput (Join-Path $evidence "server.stdout.log") -RedirectStandardError (Join-Path $evidence "server.stderr.log") -PassThru
          $env:FLET_WEB_RENDERER = "html"
          $ui = Start-Process python -ArgumentList @("scripts/run_ui_smoke.py", "--sandbox", $sandbox, "--rj", "RJ99999999", "--mirror", "http://127.0.0.1:8765", "--view", "web", "--host", "127.0.0.1", "--port", "8550") -RedirectStandardOutput (Join-Path $evidence "ui.stdout.log") -RedirectStandardError (Join-Path $evidence "ui.stderr.log") -PassThru
          "SERVER_PID=$($server.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "UI_PID=$($ui.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARSM_SANDBOX=$sandbox" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ARSM_EVIDENCE=$evidence" | Out-File -FilePath $env:GITHUB_ENV -Append
          $deadline = (Get-Date).AddMinutes(3)
          do {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8550" -UseBasicParsing -TimeoutSec 3
              if ($response.StatusCode -eq 200) { break }
            } catch {}
            Start-Sleep -Seconds 2
          } while ((Get-Date) -lt $deadline)
          if ((Get-Date) -ge $deadline) { throw "Flet Web UI did not become ready" }

      - name: Drive UI with Playwright and verify pause resume completion
        shell: pwsh
        run: |
          @'
          import json
          import os
          import re
          import sqlite3
          import time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          sandbox = Path(os.environ["ARSM_SANDBOX"])
          evidence = Path(os.environ["ARSM_EVIDENCE"])
          evidence.mkdir(parents=True, exist_ok=True)
          console_errors = []

          def wait_db_status(expected, timeout=90):
              db = sandbox / "history.db"
              deadline = time.time() + timeout
              last = None
              while time.time() < deadline:
                  if db.exists():
                      try:
                          with sqlite3.connect(db) as conn:
                              row = conn.execute("SELECT status FROM works WHERE rj_id='RJ99999999'").fetchone()
                              last = row[0] if row else None
                          if last in expected:
                              return last
                      except sqlite3.Error:
                          pass
                  time.sleep(0.5)
              raise AssertionError(f"database status did not reach {expected}; last={last}")

          def click_text(page, text):
              candidates = [
                  page.get_by_role("button", name=text, exact=True),
                  page.get_by_text(text, exact=True),
                  page.locator(f"text={text}"),
              ]
              for locator in candidates:
                  try:
                      if locator.count() and locator.first.is_visible():
                          locator.first.click(timeout=5000)
                          return
                  except Exception:
                      pass
              raise AssertionError(f"could not click text: {text}")

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width": 1600, "height": 1000})
              page.on("console", lambda msg: console_errors.append(f"{msg.type}: {msg.text}") if msg.type == "error" else None)
              page.goto("http://127.0.0.1:8550", wait_until="networkidle", timeout=120000)
              page.wait_for_timeout(5000)
              page.keyboard.press("Tab")
              page.screenshot(path=str(evidence / "01-download-center.png"), full_page=True)
              body = page.locator("body").inner_text()
              for label in ["下载中心", "资源库", "统计与成就", "系统工具", "设置", "全部暂停", "全部开始"]:
                  assert label in body, f"missing UI label: {label}"

              click_text(page, "下载")
              page.get_by_text("RJ99999999", exact=True).first.wait_for(timeout=30000)
              page.wait_for_timeout(1200)
              page.screenshot(path=str(evidence / "02-downloading.png"), full_page=True)

              click_text(page, "全部暂停")
              wait_db_status({"paused"}, timeout=30)
              deadline = time.time() + 15
              part_files = []
              while time.time() < deadline:
                  part_files = [p for p in sandbox.rglob("*.part") if p.stat().st_size > 0]
                  if part_files:
                      break
                  time.sleep(0.5)
              assert part_files, "pause did not preserve a non-empty .part file"
              part_size = max(path.stat().st_size for path in part_files)
              assert 0 < part_size < 16 * 1024 * 1024, part_size
              page.screenshot(path=str(evidence / "03-paused.png"), full_page=True)

              click_text(page, "全部开始")
              final_status = wait_db_status({"completed", "registered", "verified"}, timeout=150)
              page.wait_for_timeout(4000)
              page.screenshot(path=str(evidence / "04-completed.png"), full_page=True)

              for index, label in enumerate(["资源库", "统计与成就", "系统工具", "设置"], start=5):
                  click_text(page, label)
                  page.wait_for_timeout(1500)
                  page.screenshot(path=str(evidence / f"{index:02d}-{label}.png"), full_page=True)

              (evidence / "dom.html").write_text(page.content(), encoding="utf-8")
              (evidence / "body.txt").write_text(page.locator("body").inner_text(), encoding="utf-8")
              browser.close()

          download_files = [p for p in (sandbox / "Downloads").rglob("*") if p.is_file() and not p.name.endswith(".part")]
          assert download_files, "no final downloaded file found"
          largest = max(download_files, key=lambda p: p.stat().st_size)
          assert largest.stat().st_size == 16 * 1024 * 1024, largest.stat().st_size
          assert not list(sandbox.rglob("*.part")), "partial files remain after completion"

          with sqlite3.connect(sandbox / "history.db") as conn:
              work = conn.execute("SELECT rj_id,status,local_path FROM works WHERE rj_id='RJ99999999'").fetchone()
              downloads = conn.execute("SELECT status,downloaded_bytes,total_bytes,local_path FROM downloads WHERE rj_id='RJ99999999'").fetchall()
          assert work is not None
          assert len(downloads) == 1
          assert downloads[0][1] == downloads[0][2] == 16 * 1024 * 1024

          result = {
              "passed": True,
              "work": work,
              "downloads": downloads,
              "largest_file": str(largest),
              "largest_size": largest.stat().st_size,
              "pause_part_size": part_size,
              "final_status": final_status,
              "console_errors": console_errors,
              "sandbox_files": [str(p.relative_to(sandbox)) for p in sorted(sandbox.rglob("*")) if p.is_file()],
          }
          (evidence / "ui-acceptance.json").write_text(json.dumps(result, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          print(json.dumps(result, ensure_ascii=False, indent=2, default=str))
          '@ | Set-Content -Encoding utf8NoBOM "$env:RUNNER_TEMP/ui_acceptance.py"
          python "$env:RUNNER_TEMP/ui_acceptance.py"

      - name: Ensure isolated runtime files did not leak into repository
        shell: pwsh
        run: |
          $leaks = @("history.db", "config.json", "queue.json") | Where-Object { Test-Path $_ }
          if ($leaks.Count -gt 0) { throw "Runtime files leaked into repository: $($leaks -join ', ')" }

      - name: Stop background processes
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @("UI_PID", "SERVER_PID")) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Stop-Process -Id ([int]$value) -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload UI acceptance evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ARSM-Windows-UI-Acceptance
          path: ${{ runner.temp }}/ARSM-UI-Evidence
          if-no-files-found: error
          retention-days: 30
