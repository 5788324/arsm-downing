name: windows-release-candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Release checks
        run: python scripts/release_check.py

      - name: Build portable folder
        run: python -m PyInstaller --clean --noconfirm ARSMSuite.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ARSM-Suite/ARSM-Suite.exe")) {
            throw "ARSM-Suite.exe was not produced"
          }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $Version = python -c "from core.version import APP_VERSION; print(APP_VERSION)"
          $Zip = "ARSM-Suite-$Version-windows-x64.zip"
          Compress-Archive -Path "dist/ARSM-Suite/*" -DestinationPath $Zip
          $Hash = (Get-FileHash $Zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$Hash  $Zip" | Set-Content -Encoding ascii "$Zip.sha256"
          "RELEASE_ZIP=$Zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: actions/upload-artifact@v6
        with:
          name: ARSM-Suite-Windows
          path: |
            ${{ env.RELEASE_ZIP }}
            ${{ env.RELEASE_ZIP }}.sha256
          if-no-files-found: error
